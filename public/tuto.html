<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>WeLockIn tutorial</title>
<!--
  The in-app product tour's player, hosted here rather than embedded straight
  into the apps, for one reason: YouTube refuses an /embed/ request that carries
  no `Referer` header (PLAYABILITY_ERROR_CODE_EMBEDDER_IDENTITY_MISSING_REFERRER,
  shown to the user as "Video player configuration error", error 153).

  A WebView cannot always supply one. The macOS app is served from
  `tauri://localhost` and iOS loaded the embed as a top-level document, and
  neither of those sends a `Referer` at all. This page does: it is a real https
  document, so the iframe below is requested with `Referer: https://www.welock.in/`
  and the player configures normally. The apps just frame this page.

  Used by: welockin-desktop (Windows + macOS), welockin-mobile (iOS).
  Contract: /tuto.html?p=<key>, keys below. Keep them stable — shipped apps ask
  for them by name, and an app release is slower than a deploy of this site.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p {
    margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
    font: 500 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #8a8175; text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>
<script>
  // The demo recordings, keyed by the screen that opens them. They live HERE and
  // not in the apps so that re-recording one is a deploy of this site, rather
  // than a new release of three apps on three different review cycles.
  var VIDEOS = {
    'desktop-home': 'wjz15tuVLCo',
    'desktop-schedules': 'BbigKXpAirs',
    'ios-home': 'ewYbVf9jV9A',
    'ios-schedules': '7r3iWZpp-QU'
  };

  // An allow-list, deliberately, rather than passing a video id through from the
  // query string: this page must never become an open YouTube embedder living on
  // our own domain.
  var key = new URLSearchParams(window.location.search).get('p') || '';
  var id = Object.prototype.hasOwnProperty.call(VIDEOS, key) ? VIDEOS[key] : null;

  if (id) {
    // `mute=1` is not a preference, it is the price of `autoplay=1`: browsers
    // only grant autoplay to muted media. `loop=1` is inert on its own for a
    // single video, which is why `playlist` repeats the same id.
    var params = [
      'autoplay=1', 'mute=1', 'loop=1', 'playlist=' + id,
      'controls=1', 'fs=0', 'rel=0', 'modestbranding=1',
      'iv_load_policy=3', 'playsinline=1'
    ].join('&');

    var frame = document.createElement('iframe');
    frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?' + params;
    frame.title = 'WeLockIn tutorial';
    // `fs=0` above hides YouTube's own fullscreen control. This is the other
    // half: no `allowfullscreen`, and no `fullscreen` in `allow`, so the
    // Fullscreen API is denied to the frame outright.
    frame.setAttribute('allow', 'autoplay; encrypted-media');
    document.body.appendChild(frame);
  } else {
    var note = document.createElement('p');
    note.textContent = 'This tutorial is not available.';
    document.body.appendChild(note);
  }
</script>
</body>
</html>
